stages:
  - ci
  - cd

# Variables globales
variables:
  IMAGE_NAME: "scalian_training-java-app"
  APP_URL: "http://localhost:8084/hello"
  DEPLOY_ENV: "${CI_COMMIT_BRANCH == 'main' ? 'PRO' : 'DEV'}"

# JOB CI
ci:
  stage: ci
  image: maven:3.8.6-openjdk-11-slim
  tags:
    - docker   # equivalente a tu runner self-hosted con tag docker
  script:
    - echo "Repo: $CI_PROJECT_PATH"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo "Deploying to $DEPLOY_ENV"

    - echo "Image: $IMAGE_NAME"
    - echo "App URL: $APP_URL"

    - echo "Registry host: $REGISTRY_HOST"
    - echo "Artifactory URL: $ARTIFACTORY_URL"

    - apt-get update && apt-get install -y make

    - make lint
    - make test
  only:
    - branches

# JOB CD
cd:
  stage: cd
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  needs:
    - ci
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - echo "🚀 Ejecutando CD..."

    # Build imagen local
    - docker build -t $IMAGE_NAME:latest -f devops/Dockerfile .

    # Levantar servicios
    - docker compose up -d

    - sleep 5

    # Test E2E
    - curl -fsS $APP_URL

    # Cleanup
    - docker compose down --volumes || true
    - docker rmi "$IMAGE_NAME" || true

    # Build & Push Docker image
    - IMAGE_TAG=$CI_COMMIT_SHA
    - FULL_IMAGE_NAME=$CI_REGISTRY_IMAGE:$IMAGE_TAG

    - echo "Building $FULL_IMAGE_NAME"
    - docker build -t $FULL_IMAGE_NAME -f devops/Dockerfile .

    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin

    - docker push $FULL_IMAGE_NAME

    # Build JAR
    - mvn clean package -DskipTests

    # Upload a Artifactory
    
    - JAR_FILE=$(ls target/*.jar | head -n 1)
    - VERSION=$(basename $JAR_FILE)
    - DEST_URL="$ARTIFACTORY_URL/libs-snapshot-local/com/scalian/app/$VERSION/$VERSION"

    - echo "Uploading $JAR_FILE to $DEST_URL"

    - curl -u $ARTIFACTORY_USER:$ARTIFACTORY_PASSWORD \
        -T $JAR_FILE \
        "$DEST_URL"
