resources:
  repositories:
    - repository: iac
      type: github
      name: jtomaschico/devops-training-iac-devops  # El nombre del repositorio de GitHub
      ref: refs/heads/feat/base  # La rama de GitHub a la que estás haciendo referencia
      endpoint: jtomaschico  # El nombre de la conexión de servicio de GitHub en Azure DevOps

variables:
  - group: josetoCredentials
  - name: IMAGE_NAME
    value: "myapp"
  - name: APP_URL
    value: "your-app-url"

parameters:
  - name: RUN_CD
    type: boolean
    default: false
    displayName: "Run Continuous Deployment"

  - name: DEPLOY_ENV
    type: string
    default: DEV
    displayName: "Deployment Environment"

stages:
  - stage: CI
    displayName: "Continuous Integration"
    jobs:
      - job: Info
        displayName: "Info devops-training-java-app"
        steps:
          - script: |
              echo "Repo:   $(Build.Repository.Name)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "SHA:    $(Build.SourceVersion)"
              echo "Reason: $(Build.Reason)"
              echo "IMAGE: $(IMAGE_NAME)"
              echo "URL:   $(APP_URL)"
            displayName: "Show Info"

      - job: CI_Template
        displayName: "CI Java (template)"
        steps:
          - template: azure-pipelines/templates/ci-java-steps.yml@iac

      # Build Docker Image (comentado si no lo necesitas)
      #- job: Build_Docker_Image
      #  displayName: "Build Docker Image"
      #  steps:
      #    - script: |
      #        docker build -t $(IMAGE_NAME) \
      #          --build-arg VERSION=$(Build.BuildId) \
      #          -f devops/Dockerfile .
      #      displayName: "Build Docker Image"

  - stage: CD
    displayName: "Continuous Deployment"
    dependsOn: CI
    condition: eq('${{ parameters.RUN_CD }}', true)
    jobs:
      - job: CD
        displayName: "Continuous Deployment"
        steps:
          - script: |
              echo "🚀 Desplegando aplicación..."
              echo "Entorno de despliegue: ${{ parameters.DEPLOY_ENV }}"
            displayName: "CD Steps"
