trigger:
  branches:
    include:
      - develop
      - main

pr:
  branches:
    include:
      - develop
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - script: |
      echo "Repo:   $(Build.Repository.Name)"
      echo "Branch: $(Build.SourceBranchName)"
      echo "SHA:    $(Build.SourceVersion)"
      echo "Reason: $(Build.Reason)"
    displayName: "Info (dummy)"
