trigger:
  branches:
    include:
      - develop
      - main

pr:
  branches:
    include:
      - develop
      - main

resources:
  repositories:
    - repository: iac
      type: github
      name: jtomaschico/devops-training-iac-devops
      ref: refs/heads/feat/base
      endpoint: jtomaschico

variables:
  - group: josetoCredentials
  - name: IMAGE_NAME
    value: "myapp"  # Asegúrate de definir un nombre adecuado para la imagen Docker
  - name: APP_URL
    value: "your-app-url"  # Define tu URL de aplicación o cualquier otra variable relevante

parameters:
  - name: RUN_CD
    type: boolean
    default: false
    displayName: "Run Continuous Deployment"

  - name: DEPLOY_ENV
    type: string
    default: DEV
    displayName: "Deployment Environment"

pool:
  name: Default   # Self-hosted agent

stages:
  - stage: CI
    displayName: "Continuous Integration"
    jobs:
      - job: Info
        displayName: "Info devops-training-java-app"
        steps:
          - script: |
              echo "Repo:   $(Build.Repository.Name)"
              echo "Branch: $(Build.SourceBranchName)"
              echo "SHA:    $(Build.SourceVersion)"
              echo "Reason: $(Build.Reason)"
              echo "IMAGE: $(IMAGE_NAME)"
              echo "URL:   $(APP_URL)"
            displayName: "Show Info"

      - job: CI_Template
        displayName: "CI Java (template)"
        steps:
          - template: azure-pipelines/templates/ci-java-steps.yml@iac  

      # Build Docker Image
      - job: Build_Docker_Image
        displayName: "Build Docker Image"
        steps:
          - script: |
              docker build -t $(IMAGE_NAME):latest -f devops/Dockerfile .
            displayName: "Build Docker Image"

  - stage: CD
    displayName: "Continuous Deployment"
    dependsOn: CI
    condition: and(succeeded(), or(eq(variables['Build.SourceBranchName'], 'develop'), eq(variables['Build.SourceBranchName'], 'main')), eq(variables['Build.Reason'], 'Manual'))
    jobs:
      - job: Deploy
        displayName: "Deploy Application"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: checkout@2  # Aquí usamos minúsculas para "checkout"
            displayName: 'Checkout Repository'
            inputs:
              clean: true
              
          - script: |
              echo "🚀 Ejecutando CD..."
            displayName: "Deploy"
          
          - script: |
              echo "Building Docker image..."
              docker build -t $(IMAGE_NAME):latest -f devops/Dockerfile .
            displayName: "Build Docker Image"
